# Eigener Namespace, damit ein lokales `up` nicht die Produktionscontainer
# im selben Verzeichnis recreated (und umgekehrt).
name: coupling-internal-tools-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: backend.dockerfile
    container_name: backend_dev
    ports:
      - "8000:8000"
    environment:
      # Erstes Konto fuer die lokale Entwicklung. Wird nur angelegt, solange
      # noch gar kein Konto existiert; ein spaeter geaendertes Passwort
      # ueberschreibt der Neustart nicht.
      - ADMIN_USERNAME=chefin
      - ADMIN_PASSWORD=Lokales-Entwicklungs-Kennwort
      # Lokal laeuft alles ueber http: ein `Secure`-Cookie kaeme nie zurueck,
      # und das `__Host-`-Praefix setzt `Secure` voraus.
      - SESSION_COOKIE_NAME=session
      - SESSION_COOKIE_SECURE=0
      # Interaktive API-Doku: lokal nuetzlich, in Produktion aus.
      - ENABLE_API_DOCS=1
      # CORS-Liste mit den localhost-Origins. Standard ist aus; lokal wird sie
      # ausdruecklich eingeschaltet, damit Produktion ohne Zutun sicher ist.
      - ALLOW_DEV_ORIGINS=1
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:20-alpine
    container_name: frontend_dev
    working_dir: /app
    ports:
      - "80:5173"
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"