services:
  backend:
    build:
      context: ./backend
      dockerfile: backend.dockerfile
    container_name: backend
    expose:
      - "8000"
    volumes:
      # Das Kanban-Board ist der einzige persistente Zustand der App.
      # Ohne dieses Mount liegt die SQLite-Datei im Container und ist beim
      # naechsten Image-Rebuild verloren. Backup = dieses Verzeichnis sichern.
      - ./data/kanban:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.dockerfile
    container_name: frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./auth/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
