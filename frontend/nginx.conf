# Zweite Stufe der Brute-Force-Abwehr (ASVS 6.3.1). Die erste zaehlt im
# Backend pro (IP, Benutzername); diese hier greift unabhaengig vom
# Benutzernamen und haelt verteiltes Raten von den Argon2-Hashes fern.
# 10 r/m mit burst=5: eine Person, die sich vertippt, merkt nichts davon.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# --------------------
# HTTP → HTTPS
# --------------------
server {
    listen 80;
    server_name coupling-internal-tools.de www.coupling-internal-tools.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Fuer den Container-Healthcheck. Bewusst im HTTP-Block: kein Zertifikat
    # und keine Basic Auth im Weg. Gibt nichts ueber den Zustand preis, was
    # ein Verbindungsversuch nicht auch zeigen wuerde.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------
# HTTPS
# --------------------
server {
    listen 443 ssl;
    server_name coupling-internal-tools.de www.coupling-internal-tools.de;

    ssl_certificate     /etc/letsencrypt/live/coupling-internal-tools.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coupling-internal-tools.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Anmeldung: derselbe Proxy wie /api/, zusaetzlich mit Rate Limit.
    # Eigener Block, weil `limit_req` nicht auf einen Teil einer Location
    # angewendet werden kann. nginx waehlt bei Praefix-Locations den
    # laengsten Treffer, dieser gewinnt also gegen /api/.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        # Bulk-Bilduploads (WebP-Konverter) sprengen nginx' 1M-Default.
        client_max_body_size 256m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
